name: Unit tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  unit_tests:
    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13", "3.14" ]

    runs-on: ${{matrix.os}}

    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository.
        uses: actions/checkout@v5

      # Poetry itself requires Python 3.10+, but the project is tested down to 3.9.
      # Poetry is installed with its own interpreter and creates the venv with the active one.
      - name: Set up Python for Poetry.
        id: poetry-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Load cached Poetry installation.
        id: cached-poetry
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: poetry-${{ runner.os }}-${{ steps.poetry-python.outputs.python-version }}-2.4.1  # bump the suffix to reset the cache

      - name: Setup Poetry.
        if: steps.cached-poetry.outputs.cache-hit != 'true'
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1

      - name: Add Poetry to PATH.
        if: runner.os != 'Windows'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python.
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Load cached venv.
        id: cached-venv
        # caching the venv stalls for hours on Windows runners
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies.
        if: steps.cached-venv.outputs.cache-hit != 'true'
        run: poetry install --without docs

      - name: Run Tests.
        run: poetry run pytest

  websockets_compat:
    name: websockets ${{matrix.websockets}} (${{matrix.os}}, py${{matrix.python-version}})

    strategy:
      fail-fast: false
      matrix:
        include:
          # websockets v15 is the last version supporting Python 3.9
          - { os: ubuntu-latest, python-version: "3.10", websockets: "15" }
          # websockets v16 is the last version supporting Python 3.10
          - { os: ubuntu-latest, python-version: "3.10", websockets: "16" }
          - { os: ubuntu-latest, python-version: "3.11", websockets: "16" }
          # websockets v17 requires Python 3.11+
          - { os: ubuntu-latest, python-version: "3.11", websockets: "17" }
          - { os: ubuntu-latest, python-version: "3.13", websockets: "17" }
          - { os: macos-latest, python-version: "3.14", websockets: "17" }
          - { os: windows-latest, python-version: "3.14", websockets: "17" }

    runs-on: ${{matrix.os}}

    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository.
        uses: actions/checkout@v5

      # Poetry itself requires Python 3.10+, but the project is tested down to 3.9.
      # Poetry is installed with its own interpreter and creates the venv with the active one.
      - name: Set up Python for Poetry.
        id: poetry-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup Poetry.
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1

      - name: Add Poetry to PATH.
        if: runner.os != 'Windows'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python.
        uses: actions/setup-python@v6
        with:
          python-version: ${{matrix.python-version}}

      - name: Install dependencies.
        run: poetry install --without docs

      # Overrides the version poetry.lock pins. Fails loudly if the pin is unsatisfiable.
      - name: Pin websockets to v${{matrix.websockets}}.
        run: |
          poetry run python -m pip install \
            "websockets>=${{matrix.websockets}},<$((${{matrix.websockets}} + 1))"
          poetry run python -c "import websockets; print('websockets', websockets.__version__)"

      - name: Run Tests.
        run: poetry run pytest
